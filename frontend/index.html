<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMIKP - Kota Batu</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="error-log" style="position: fixed; top: 0; left: 0; z-index: 9999; background: red; color: white; padding: 10px; display: none; max-height: 100vh; overflow: auto; width: 100vw;"></div>
    <script>
      window.addEventListener('error', function(e) {
        document.getElementById('error-log').style.display = 'block';
        document.getElementById('error-log').innerHTML += '<p>ERROR: ' + e.message + '<br>' + e.filename + ':' + e.lineno + '</p>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.getElementById('error-log').style.display = 'block';
        document.getElementById('error-log').innerHTML += '<p>PROMISE ERROR: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</p>';
      });
      const originalError = console.error;
      console.error = function(...args) {
        document.getElementById('error-log').style.display = 'block';
        document.getElementById('error-log').innerHTML += '<p>CONSOLE.ERROR: ' + args.join(' ') + '</p>';
        originalError.apply(console, args);
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
